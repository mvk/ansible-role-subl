# X-SPD
---
# install packages
#

- name: Ensure Sublime Text User directory exists
  ansible.builtin.file:
    path: "{{ ansible_user_dir }}/.config/sublime-text/Packages/User"
    state: directory
    mode: '0755'

- name: Deploy Package Control settings
  ansible.builtin.copy:
    dest: "{{ ansible_user_dir }}/.config/sublime-text/Packages/User/Package Control.sublime-settings"
    # We construct a dictionary on the fly and convert it to JSON
    content: "{{ {'installed_packages': mvk_subl_packages} | to_nice_json }}"
    mode: '0644'
